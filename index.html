<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP de fallback para o dev server do Vite (que não lê o vercel.json).

      ATENÇÃO — por que `connect-src` lista localhost E https:

      quando o navegador encontra DUAS políticas CSP (o header do vercel.json
      e este <meta>), ele aplica a MAIS RESTRITIVA das duas. Se este <meta>
      só liberta `http://localhost:*`, a produção quebra: o header permite
      `https:`, mas o <meta> não — e o `POST /auth/login` para o Render morre
      com "violates Content Security Policy". O sintoma é o login não funcionar
      sem mensagem de erro na tela, porque o navegador cancela a requisição
      ANTES dela sair.

      Por isso `https:` entra aqui. É mais permissivo do que o estritamente
      necessário, mas o que realmente estreita a política é `script-src 'self'`
      (é o que impede injeção de script); `connect-src` só controla para onde
      a página pode enviar dados.

      `style-src` precisa de 'unsafe-inline' porque o Vue injeta <style>
      no escopo do componente. `script-src` NÃO tem 'unsafe-inline' nem
      'unsafe-eval': é o que impede injeção de script ser executada.

      `http://localhost:4000` é o serviço de monitoramento das câmeras DVR, que
      roda NA MÁQUINA DA REDE PRIVADA: o navegador não envia ICMP, então quem faz
      o ping tem de ser a máquina que alcança as escolas. Em produção ele entra
      pelo `https:` do hostname do Cloudflare Tunnel — por isso o header do
      vercel.json não precisa citar a porta; aqui o `http://localhost:*` é o que
      faz o dev funcionar.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:10000 http://localhost:3000 http://localhost:4000 ws://localhost:5173 ws://localhost:10000 ws://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PORTAL URE LESTE 3</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
